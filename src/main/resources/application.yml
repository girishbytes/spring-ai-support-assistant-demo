spring:
  application:
    name: support-assistant
    context-path: /support-assistant

    datasource:
      url: jdbc:postgresql://localhost:5432/support_assistant
      username: ${POSTGRES_USER:support_user}
      password: ${POSTGRES_PASSWORD:support_password}

      jpa:
        hibernate:
          ddl-auto: validate
        open-in-view: false

      flyway:
        enabled: true

    server:
      port: 8080

    management:
      endpoints:
        web:
          exposure:
            include: health,info,flyway