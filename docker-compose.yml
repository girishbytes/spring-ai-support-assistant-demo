services:

  postgres:
    image: postgres:17
    container_name: support-assistant-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-support_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-support_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_password}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-support_user} -d ${POSTGRES_DB:-support_assistant}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: